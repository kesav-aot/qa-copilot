# Contains a destructive verb, so the policy engine raises this to medium risk
# and refuses to run it until a human approves the fingerprint.
version: 1
name: Admin can disable an active user
environment: demo
risk: low            # declared low; the engine will infer medium and win
tags: [users, destructive]

steps:
  - action: authenticate
    capability: manage_users

  - action: navigate
    path: /users

  - action: click
    target: { testid: disable-user-1 }

  - action: assert
    kind: visible
    target: { testid: user-status-1 }

  - action: assert
    kind: text
    expected: disabled
