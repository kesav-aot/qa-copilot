# Publishes the Claude Desktop extension when a version tag is pushed.
#
# The download link is the whole point: a QA engineer cannot be asked to clone a
# repository and build an artifact. Building it here rather than by hand also
# means the published extension cannot quietly drift from the source it claims
# to be.
#
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v*"]
  # So the release can also be built from the Actions tab, without a terminal:
  # Actions -> release -> Run workflow.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish. Leave blank to use packaging/mcpb/manifest.json."
        required: false
        default: ""

permissions:
  contents: write        # required to create the release and attach the asset

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Whichever way this was started, the version that gets published and the
      # version inside the bundle must agree — otherwise people download a file
      # whose name says one thing and whose contents say another.
      - name: Work out the version
        id: version
        run: |
          manifest=$(python -c "import json;print(json.load(open('packaging/mcpb/manifest.json'))['version'])")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            asked="${{ inputs.version }}"
            asked="${asked#v}"
            version="${asked:-$manifest}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "asked for: $version   manifest says: $manifest"
          if [ "$version" != "$manifest" ]; then
            echo "::error::version $version does not match manifest version $manifest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # build_mcpb.py uses only the standard library, so there is nothing to install.
      - name: Build the extension
        run: python scripts/build_mcpb.py

      # Deliberately a script file, not an inline heredoc: it can then be run
      # locally, and YAML indentation cannot change what it does. It uses only
      # the standard library, so the runner needs nothing installed.
      - name: Check what is inside it
        run: python scripts/check_mcpb.py

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # gh creates the tag from the current commit when it does not exist,
          # which is what makes the Run-workflow button work.
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/qa-copilot-*.mcpb \
            --title "QA Copilot $TAG" \
            --notes "Download the \`.mcpb\` below and double-click it to install into Claude Desktop. No terminal, no clone, no Python — it sets itself up on first run.

          Full instructions: [docs/INSTALL-DESKTOP.md](https://github.com/kesav-aot/qa-copilot/blob/main/docs/INSTALL-DESKTOP.md)"
