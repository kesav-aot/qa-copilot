[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-copilot"
version = "0.1.3"
description = "Secret-blind AI QA agent: the model plans, a trusted layer holds the credentials"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "playwright>=1.44",
]

[project.optional-dependencies]
demo = ["flask>=3.0"]
vault = ["cryptography>=42"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "flask>=3.0", "openpyxl>=3.1"]

[project.scripts]
qa-copilot = "qa_copilot.cli:main"
qa-copilot-mcp = "qa_copilot.mcp_server:main"

[tool.setuptools.packages.find]
include = ["qa_copilot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_classes = ["*Tests"]  # keep pytest away from dsl.TestPlan
