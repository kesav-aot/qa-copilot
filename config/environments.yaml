# Environments the QA Copilot may target.
# The model sees `name` and `base_url` only. The login recipe stays here, in the
# trusted layer, so the model never decides how a credential is typed.

environments:

  demo:
    base_url: http://127.0.0.1:8099
    api_base_url: http://127.0.0.1:8099
    login:
      path: /login
      username_target: { testid: login-username }
      password_target: { testid: login-password }
      submit_target:   { testid: login-submit }
      success_url_contains: /dashboard
      success_target:  { testid: dashboard-heading }
      failure_target:  { testid: login-error }
    api_auth:
      mode: bearer
      header_name: Authorization
      login_path: /api/login

  # Template for a real environment. Policy blocks anything named production.
