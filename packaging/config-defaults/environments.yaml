# A fresh install knows about no applications at all, on purpose.
#
# Whoever installs this adds theirs through the setup page, which looks at the
# real sign-in form and asks for exactly the credentials it wants. Shipping
# anything here means everyone is asked about accounts that are nothing to do
# with them — and a demo entry would point at a port with nothing listening,
# because the demo application is not part of the distributed package.

environments: {}
